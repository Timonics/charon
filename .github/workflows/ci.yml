name: ci

# Run on every push to main, every PR targeting main, and every push
# to feature branches (for preview status). The integration job is
# gated on PRs/main so feature-branch pushes don't burn DB minutes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-progress runs on the same PR when a new commit lands — keeps
# CI queue moving when authors force-push or rebase.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Service-container hostname exposed to test code via DATABASE_URL.
  # The test/integration-setup.ts fallback already matches this default.
  DATABASE_URL: postgres://postgres:postgres@localhost:5433/charon

jobs:
  # ---------------------------------------------------------------
  # Job 1 — Lint + unit tests + build.
  # Fast, no Docker. Runs on every push and PR. The bar is "the
  # 187-test suite is green + zero lint errors + nest build succeeds".
  # ---------------------------------------------------------------
  lint-and-unit:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22 (matches .nvmrc + @types/node)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build (TypeScript via nest build)
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci

  # ---------------------------------------------------------------
  # Job 2 — Integration tests against a real Postgres.
  # Postgres 16 service container (matches docker-compose.yml). Runs
  # migrations + every *.integration-spec.ts file with
  # --runInBand (sequential — integration tests share a schema and
  # would race on parallel connections).
  #
  # Gated to PRs + main pushes: feature-branch pushes don't burn DB
  # minutes because they get the preview status from job 1 alone.
  # ---------------------------------------------------------------
  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-unit
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: charon
        ports:
          - 5433:5432
        # Healthcheck so the test step waits for the DB to actually
        # accept connections (postgres:16-alpine boots in ~2s, but
        # network port-forward races can take longer on shared CI).
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22 (matches .nvmrc + @types/node)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Postgres client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres to accept connections
        run: |
          for i in {1..20}; do
            if pg_isready -h localhost -p 5433 -U postgres; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... attempt $i"
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Run migrations
        run: npm run migrate

      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/charon
